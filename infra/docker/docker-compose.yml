services:
  postgres:
    image: postgres:16-alpine
    container_name: surgical-platform-postgres
    environment:
      POSTGRES_DB: surgical_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - surgical_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d surgical_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - surgical_platform_local

  redis:
    image: redis:7-alpine
    container_name: surgical-platform-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - surgical_platform_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - surgical_platform_local

  adminer:
    image: adminer:4-standalone
    container_name: surgical-platform-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r \"exit(@file_get_contents('http://127.0.0.1:8080') === false ? 1 : 0);\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - surgical_platform_local

volumes:
  surgical_platform_postgres:
  surgical_platform_redis:

networks:
  surgical_platform_local:
    driver: bridge
